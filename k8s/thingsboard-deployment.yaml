apiVersion: v1
kind: Namespace
metadata:
  name: thingsboard
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: thingsboard-config
  namespace: thingsboard
data:
  # Database
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/thingsboard"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.PostgreSQLDialect"
  
  # ThingsBoard settings
  TB_SERVICE_TYPE: "monolith"
  
  # Queue (default in-memory)
  TB_QUEUE_TYPE: "in-memory"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: thingsboard
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: thingsboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        env:
        - name: POSTGRES_DB
          value: "thingsboard"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: thingsboard
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thingsboard
  namespace: thingsboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thingsboard
  template:
    metadata:
      labels:
        app: thingsboard
    spec:
      containers:
      - name: thingsboard
        image: thingsboard/tb-node:latest
        env:
        - name: TB_SERVICE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        envFrom:
        - configMapRef:
            name: thingsboard-config
        ports:
        - containerPort: 8080
        - containerPort: 1883
        - containerPort: 5683
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /login
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /login
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: thingsboard
  namespace: thingsboard
spec:
  type: NodePort
  selector:
    app: thingsboard
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 30080
  - name: mqtt
    port: 1883
    targetPort: 1883
    nodePort: 31883
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: thingsboard
type: Opaque
stringData:
  password: "tb-postgres-2026-secure"
